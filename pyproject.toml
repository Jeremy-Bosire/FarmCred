[project]
name = "farmcred"
version = "0.1.0"
description = "Alternative agricultural credit scoring for Kenyan smallholder farmers — rules-based scorecard and swappable connector pipeline"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.8",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
]

[project.scripts]
farmcred = "run_pipeline:main"

[tool.pytest.ini_options]
# `credit_scoring_pipeline/` is the import root, which is what keeps the flat
# `import config` / `from scoring import ...` imports in the PRD file tree
# working without turning every module into a nested package path.
pythonpath = ["credit_scoring_pipeline"]
testpaths = ["credit_scoring_pipeline/tests"]
addopts = "-ra -q"
filterwarnings = ["error::DeprecationWarning"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["credit_scoring_pipeline"]
